l_braz_por:

sm_crew_quarters_enigmatic_fortress: "Base de descanso da tripulação"
sm_crew_quarters_enigmatic_fortress_desc: "Oferece enorme espaço e comodidades para tripulações de navios estacionadas e equipe de logística. Reduz drasticamente a carga de manutenção logística das frotas atracadas aqui.\n"
sm_target_uplink_computer_enigmatic_fortress: "Rede Dominador $sm_target_uplink_computer$"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nEssa versão aprimorada funciona em conjunto com dispositivos de computação distribuídos espalhados por toda a estação, alcançando uma resolução espacial muito maior.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nProjetado especificamente para o $deep_space_enigmatic_fortress$, esse recurso oferece desempenho muito superior em sistemas semelhantes.\n"
sm_deep_space_black_site_enigmatic_fortress: "Supermax $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nO enorme espaço desta estação permite a instalação de instalações adicionais de correção supermax, superando o desempenho de instalações similares.\n"
sm_resource_silo_enigmatic_fortress: "Superescala $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nAo usar a enorme escala do $deep_space_enigmatic_fortress$, a quantidade de recursos armazenados poderia ser drasticamente aumentada em instalações semelhantes.\n"