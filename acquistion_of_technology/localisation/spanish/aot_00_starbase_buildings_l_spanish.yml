l_spanish:

sm_crew_quarters_enigmatic_fortress: "Base de descanso de la tripulación"
sm_crew_quarters_enigmatic_fortress_desc: "Proporciona un enorme espacio y comodidades para las tripulaciones de barcos estacionadas y el personal logístico. Reduce drásticamente la carga de mantenimiento logístico de las flotas atracadas aquí.\n"
sm_target_uplink_computer_enigmatic_fortress: "Red Dominator $sm_target_uplink_computer$"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nEsta versión mejorada funciona en conjunto con dispositivos informáticos distribuidos dispersos por toda la estación logrando una resolución espacial mucho mayor.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nDiseñada específicamente para $deep_space_enigmatic_fortress$, esta instalación ofrece un rendimiento mucho mayor que sistemas similares.\n"
sm_deep_space_black_site_enigmatic_fortress: "Supermax $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nEl enorme espacio de esta estación permite la instalación de instalaciones correccionales supermax adicionales, superando el rendimiento de instalaciones similares.\n"
sm_resource_silo_enigmatic_fortress: "Superescala $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nAl utilizar la escala masiva de $deep_space_enigmatic_fortress$, la cantidad de recursos almacenados podría aumentar drásticamente en comparación con instalaciones similares.\n"