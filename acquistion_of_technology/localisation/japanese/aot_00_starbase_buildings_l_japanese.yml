l_japanese:

sm_crew_quarters_enigmatic_fortress: "乗組員休憩基地"
sm_crew_quarters_enigmatic_fortress_desc: "駐在の船舶乗組員や物流スタッフに広大なスペースとアメニティを提供します。ここに停泊している艦隊の物流維持の負担が大幅に軽減されます。\n"
sm_target_uplink_computer_enigmatic_fortress: "ドミネーター $sm_target_uplink_computer$ ネットワーク"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nこのアップスケール バージョンは、ステーション全体に点在する分散コンピューティング デバイスと連携して動作し、より高い空間解像度を実現します。\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nこの機能は $deep_space_enigmatic_fortress$ 用に特別に設計されており、同様のシステムよりもはるかに高いパフォーマンスを実現します。\n"
sm_deep_space_black_site_enigmatic_fortress: "スーパーマックス $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nこのステーションの広大なスペースにより、追加のスーパーマックス補正施設の設置が可能となり、同様の施設の性能を上回ります。\n"
sm_resource_silo_enigmatic_fortress: "スーパースケール $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\n$deep_space_enigmatic_fortress$ の大規模なスケールを使用することで、保管されているリソースの量が同様の施設よりも大幅に増加する可能性があります。\n"