l_french:

sm_crew_quarters_enigmatic_fortress: "Base de repos de l'équipage"
sm_crew_quarters_enigmatic_fortress_desc: "Offre un espace et des commodités considérables pour les équipages des navires stationnés et le personnel logistique. Cela réduit considérablement la charge d'entretien logistique des flottes amarrées ici.\n"
sm_target_uplink_computer_enigmatic_fortress: "Réseau Dominator $sm_target_uplink_computer$"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nCette version améliorée fonctionne en tandem avec des appareils informatiques distribués dispersés sur l'ensemble de la station, atteignant une résolution spatiale beaucoup plus élevée.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nSpécialement conçue pour $deep_space_enigmatic_fortress$, cette installation offre des performances bien supérieures à celles de systèmes similaires.\n"
sm_deep_space_black_site_enigmatic_fortress: "Supermax $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nL'énorme espace de cette station permet l'installation d'installations de correction Supermax supplémentaires, surpassant les performances d'installations similaires.\n"
sm_resource_silo_enigmatic_fortress: "Superscale $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nEn utilisant l'échelle massive de $deep_space_enigmatic_fortress$, la quantité de ressources stockées pourrait être considérablement augmentée par rapport à des installations similaires.\n"