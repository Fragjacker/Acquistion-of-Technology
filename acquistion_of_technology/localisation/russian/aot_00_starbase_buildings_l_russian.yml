l_russian:

sm_crew_quarters_enigmatic_fortress: "База отдыха экипажа"
sm_crew_quarters_enigmatic_fortress_desc: "Предоставляет огромное пространство и удобства для дислоцированных экипажей кораблей и логистического персонала. Это радикально снижает логистическую нагрузку на флоты, стоящие здесь.\n"
sm_target_uplink_computer_enigmatic_fortress: "Сеть Доминатора $sm_target_uplink_computer$"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nЭта увеличенная версия работает в тандеме с распределенными вычислительными устройствами, разбросанными по всей станции, обеспечивая гораздо более высокое пространственное разрешение.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nСпециально разработанный для $deep_space_enigmatic_fortress$, этот объект обеспечивает гораздо более высокую производительность по сравнению с аналогичными системами.\n"
sm_deep_space_black_site_enigmatic_fortress: "Супермакс $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nОгромное пространство этой станции позволяет установить дополнительные сверхмаксимальные корректирующие средства, превосходящие по производительности аналогичные средства.\n"
sm_resource_silo_enigmatic_fortress: "Супермасштаб $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nБлагодаря использованию огромного масштаба $deep_space_enigmatic_fortress$ количество хранимых ресурсов может быть значительно увеличено по сравнению с аналогичными объектами.\n"