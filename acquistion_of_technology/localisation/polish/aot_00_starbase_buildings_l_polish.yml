l_polish:

sm_crew_quarters_enigmatic_fortress: "Baza wypoczynkowa załogi"
sm_crew_quarters_enigmatic_fortress_desc: "Zapewnia ogromną przestrzeń i udogodnienia dla stacjonujących załóg statków i personelu logistycznego. To drastycznie zmniejsza obciążenie logistyczne flot zacumowanych tutaj.\n"
sm_target_uplink_computer_enigmatic_fortress: "Dominator $sm_target_uplink_computer$ Sieć"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nTa ulepszona wersja działa w tandemie z rozproszonymi urządzeniami komputerowymi rozproszonymi po całej stacji, osiągając znacznie wyższą rozdzielczość przestrzenną.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nSpecjalnie zaprojektowane dla $deep_space_enigmatic_fortress$, funkcja ta zapewnia znacznie wyższą wydajność w porównaniu z podobnymi systemami.\n"
sm_deep_space_black_site_enigmatic_fortress: "Supermax $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nOgromna przestrzeń tej stacji pozwala na instalację dodatkowych urządzeń korekcyjnych supermax, przewyższających wydajność podobnych obiektów.\n"
sm_resource_silo_enigmatic_fortress: "Superskala $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nWykorzystując ogromną skalę $deep_space_enigmatic_fortress$, ilość przechowywanych zasobów może zostać drastycznie zwiększona w porównaniu z podobnymi obiektami.\n"