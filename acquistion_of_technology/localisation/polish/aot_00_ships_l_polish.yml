ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR: "Potrójny reaktor $sr_dark_matter$"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_DESC: "Największy, jaki kiedykolwiek opracowano, reaktor tego typu dla pojedynczego obiektu w kosmosie. Zapewnia wystarczającą moc do uruchomienia wszystkich systemów tajemniczej fortecy."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_AE: "Potrójny reaktor $acot_sr_dark_energy$"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_AE_DESC: "Ogromne ulepszenie w stosunku do poprzedniej generacji reaktorów $sr_dark_matter$ dało tę bestię systemu energetycznego. Trzy osobliwości $acot_sr_dark_energy$ powinny pokryć Twoje zwiększone zapotrzebowanie na moc, aby obrócić przeciwników w popiół."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_SE: "Potrójny reaktor $acot_sr_stellarite$"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_SE_DESC: "Nic innego jak trzy osobliwości $acot_sr_stellarite$ zapewniają niewyobrażalne ilości energii do zasilania twojej drogiej broni $acot_sr_stellarite$."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_PE: "Potrójny reaktor Phi"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_PE_DESC: "Ratując statki $civic_acot_phanon_corps$, byliśmy w stanie częściowo odtworzyć ich technologię, co pozwoliło nam opracować prototyp reaktora."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_RE: "Potrójny reaktor runiczny"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_RE_DESC: "Nic innego jak największy, jaki kiedykolwiek wymyślono, zaprzeczający rzeczywistości reaktor runiczny. Został specjalnie zaprojektowany do współpracy wyłącznie z tajemniczą fortecą i nie można go używać nigdzie indziej. Moc wyjściowa jest wystarczająco wysoka, aby utrzymać w trybie online nawet najbardziej energochłonną broń."

