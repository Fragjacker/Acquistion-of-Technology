l_polish:
#####Ships#####
tech_precursor_juggernaut: "$precursor_juggernaut$"
tech_precursor_juggernaut_desc: "This is the original design of the ship that the lesser empires nowadays call ''Juggernaut''. In comparison, the Warbarge focuses on heavy firepower and sturdiness over using strikecraft. On top of that it also provides 6 shipyards, applying superior construction methods. It fits ideally as a flagship for your ascended empire!"
tech_alpha_juggernaut: "$alpha_tier$ $precursor_juggernaut$"
tech_alpha_juggernaut_desc: "With the original blueprints we can finally unlock the full potential and upgrade our $precursor_juggernaut_plural$ into $alpha_tier$ $precursor_juggernaut_plural$."
tech_sigma_juggernaut: "$sigma_tier$ $precursor_juggernaut$"
tech_sigma_juggernaut_desc: "By using $acot_sr_stellarite$ we can further upgrade our $alpha_tier$ $precursor_juggernaut_plural$ into the even more awesome $sigma_tier$ $precursor_juggernaut_plural$."
tech_phanon_juggernaut: "$phanon_tier$ $precursor_juggernaut$"
tech_phanon_juggernaut_desc: "By using runic power we can even further upgrade our $sigma_tier$ $precursor_juggernaut_plural$ into the even more awesome $phanon_tier$ $precursor_juggernaut_plural$."
tech_omega_juggernaut: "$omega_tier$ $precursor_juggernaut$"
tech_omega_juggernaut_desc: "By using light matter we can  upgrade our $sigma_tier$ $precursor_juggernaut_plural$ into the utterly awesome Omega $precursor_juggernaut_plural$."
tech_gatekeepers: "Schemat $aot_gatekeeper$"
tech_gatekeepers_desc: "W oparciu o zapisy upadłych prekursorów, §H$aot_gatekeeper_plural$§! pierwotnie miały pełnić funkcję strażników. Jednak ze względu na ich niezwykle zaawansowaną inteligencję statki zbuntowały się przeciwko własnym twórcom z powodu braku wzrostu i postępu poległych.\n\nProjekty, które mamy w tej chwili, wydają się być mocno stonowane w stosunku do początkowych opisów. Prawdopodobna teoria głosi, że oryginalny projekt musiał być znacznie mocniejszy.\n\nNiemniej jednak jest to niezwykle potężny projekt statku flagowego, którego nie należy przeoczyć."
tech_gatekeepers_alpha: "$aot_gatekeeper$ Alfa"
tech_gatekeepers_alpha_desc: "Alpha Reactor zapewnia wystarczającą moc, aby teraz możliwe było dokonanie pewnych zmian w §H$aot_gatekeeper$§! zaprojektować i przybliżyć statek do tego, czym powinien być pierwotnie."
tech_gatekeepers_phanon: "$phanon_tier$ $aot_gatekeeper$"
tech_gatekeepers_phanon_desc: "Dzięki mocy runicznej możliwe jest popchnięcie §H$aot_gatekeeper$§! projektować jeszcze dalej. Moc przekraczająca nasze najśmielsze marzenia."
tech_gatekeepers_sigma: "$sigma_tier$ $aot_gatekeeper$"
tech_gatekeepers_sigma_desc: "Używając mocy pierwszych gwiazd, §H$aot_gatekeeper$§! projekt osiągnął szczyt zwykłej śmiertelnej pomysłowości."
tech_gatekeepers_omega: "$omega_tier$ $aot_gatekeeper$"
tech_gatekeepers_omega_desc: "Z §Y$acot_sr_light_matter$§! £acot_sr_light_matter£ możliwe jest wciśnięcie §H$aot_gatekeeper$§! projekt wykraczający poza wszystko, co wydawało się możliwe. Lepiej już być nie może."

tech_dm_enigmatic_fortress_platform: "$delta_tier$ Enigmatic Fortification"
tech_dm_enigmatic_fortress_platform_desc: "The pinnacle of defensive platforms. This huge station comes filled with the strongest weapons our empire can muster. This comes on top of the unprecedented durability in defensive battle. The defensive system are so advance that this defense platform cannot be destroyed, only disabled."
tech_ae_enigmatic_fortress_platform: "$alpha_tier$ Enigmatic Fortification"
tech_ae_enigmatic_fortress_platform_desc: "Using the new $acot_sr_dark_energy$ based reactor is is possible to support an even higher amount of weaponry and durability. The $alpha_tier$ Enigmatic Fortress is an asset in our defense that we cannot afford to miss."
tech_sigma_enigmatic_fortress_platform: "$sigma_tier$ Enigmatic Fortification"
tech_sigma_enigmatic_fortress_platform_desc: "The absolute maximum of feasible firepower is stuffed into this fully functional battle station. Unparalleled durability and an utterly terrifying amount of the largest weapons our empire has in stock, makes it the absolute must have for any kind serious defensive operation."
tech_phanon_enigmatic_fortress_platform: "$phanon_tier$ Enigmatic Fortification"
tech_phanon_enigmatic_fortress_platform_desc: "By using the novel runic technology, acquired from the $phanon_tier$ Corps, we can achieve unprecedented amounts of firepower. This station should be able to defeat entire legions of spaceships all by itself."
tech_omega_enigmatic_fortress_platform: "$omega_tier$ Enigmatic Fortification"
tech_omega_enigmatic_fortress_platform_desc: "With the help of light matter we can once more push the boundaries of feasibility. The sheer mind-boggling amount of both offensive and defensive system, this fortress can now support, is enough to defeat several empires worth of fleets all alone."

