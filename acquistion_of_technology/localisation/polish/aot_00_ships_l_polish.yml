PHANON_MEGATURRET_DARK_MATTER_REACTOR_RE: "$phanon_tier$ Przewód zasilający Ultrafex"
PHANON_MEGATURRET_DARK_MATTER_REACTOR_RE_DESC: "§R$PHANON_MEGATURRET_DARK_MATTER_REACTOR_RE$§! to punkt końcowy systemu obejmującego sieć energetyczną osadzony w §R$pgr$§!. Niekończące się rzędy reaktorów wielkości planety, połączonych niezliczonymi międzywymiarowymi bankami energii w czasie zerowym, zdolnymi w mgnieniu oka wyzwolić ilości energii przekraczające rzeczywistość."
PHANON_MEGATURRET_DARK_MATTER_REACTOR_SE: "$sigma_tier$ Gigaflux przewód zasilający"
PHANON_MEGATURRET_DARK_MATTER_REACTOR_SE_DESC: "§H$PHANON_MEGATURRET_DARK_MATTER_REACTOR_SE$§! to punkt końcowy systemu obejmującego sieć energetyczną osadzony w §R$pgr$§!. Niekończące się rzędy przestrzennie skompresowanych reaktorów wielkości planety, połączonych niezliczonymi transuniwersalnymi bateriami kondensatorów nad strumieniem, zdolnymi w jednej chwili wyzwolić miażdżące rzeczywistości ilości energii."

