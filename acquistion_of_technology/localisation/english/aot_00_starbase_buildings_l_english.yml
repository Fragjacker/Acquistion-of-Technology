l_english:

sm_crew_quarters_enigmatic_fortress: "Crew Resting Base"
sm_crew_quarters_enigmatic_fortress_desc: "Provides tremendous space and amenities for stationed ship crews and logistical staff. It drastically reduces the logistical upkeep burden on fleets, berthed here.\n"
sm_target_uplink_computer_enigmatic_fortress: "Dominator $sm_target_uplink_computer$ Network"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nThis upscaled version works in tandem with distributed computing devices scattered over the entire station achieving much higher spatial resolution.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc:"$sm_command_center_desc$\nSpecifically designed for the $deep_space_enigmatic_fortress$ this facility yields much higher performance over similar systems.\n"
sm_deep_space_black_site_enigmatic_fortress: "Supermax $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nThe tremendous space of this station allow for the installation additional supermax correction facilities, surpassing the performance of similar facilities.\n"
sm_resource_silo_enigmatic_fortress: "Superscale $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nBy using the massive scale of the $deep_space_enigmatic_fortress$ the amount of stored resources could be drastically increased over similar facilities.\n"