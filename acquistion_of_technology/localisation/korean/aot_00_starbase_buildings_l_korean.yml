l_korean:

sm_crew_quarters_enigmatic_fortress: "승무원 휴식 기지"
sm_crew_quarters_enigmatic_fortress_desc: "주둔 선박 승무원과 물류 직원을 위한 엄청난 공간과 편의 시설을 제공합니다. 여기에 정박한 함대의 물류 유지 부담을 대폭 줄여줍니다.\n"
sm_target_uplink_computer_enigmatic_fortress: "Dominator $sm_target_uplink_computer$ 네트워크"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\n이 확장 버전은 전체 스테이션에 분산된 분산 컴퓨팅 장치와 함께 작동하여 훨씬 더 높은 공간 해상도를 달성합니다.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\n$deep_space_enigmatic_fortress$용으로 특별히 설계된 이 기능은 유사한 시스템에 비해 훨씬 더 높은 성능을 제공합니다.\n"
sm_deep_space_black_site_enigmatic_fortress: "슈퍼맥스 $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\n이 스테이션의 엄청난 공간 덕분에 유사한 시설의 성능을 능가하는 추가 슈퍼맥스 교정 시설을 설치할 수 있습니다.\n"
sm_resource_silo_enigmatic_fortress: "슈퍼스케일 $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\n$deep_space_enigmatic_fortress$의 대규모 규모를 사용하면 유사한 시설에 비해 저장된 리소스의 양을 대폭 늘릴 수 있습니다.\n"