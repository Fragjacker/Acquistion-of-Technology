l_german:

sm_crew_quarters_enigmatic_fortress: "Besatzungsruhebasis"
sm_crew_quarters_enigmatic_fortress_desc: "Bietet enormen Platz und Annehmlichkeiten für stationierte Schiffsbesatzungen und Logistikpersonal. Es reduziert den logistischen Wartungsaufwand für die hier liegenden Flotten drastisch.\n"
sm_target_uplink_computer_enigmatic_fortress: "Dominator $sm_target_uplink_computer$ Netzwerk"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\nDiese hochskalierte Version arbeitet mit verteilten Computergeräten zusammen, die über die gesamte Station verstreut sind, und erreicht eine viel höhere räumliche Auflösung.\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\nDiese Einrichtung wurde speziell für die $deep_space_enigmatic_fortress$ entwickelt und bietet eine viel höhere Leistung als ähnliche Systeme.\n"
sm_deep_space_black_site_enigmatic_fortress: "Supermax $sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\nDie enormen Ausmaße dieser Station ermöglicht die Installation zusätzlicher Supermax-Korrektureinrichtungen, die die Leistung ähnlicher Einrichtungen übertreffen.\n"
sm_resource_silo_enigmatic_fortress: "Superskalare $sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\nDurch die Nutzung der enormen Größe der $deep_space_enigmatic_fortress$ konnte die Menge der gelagerten Ressourcen im Vergleich zu ähnlichen Einrichtungen drastisch erhöht werden.\n"