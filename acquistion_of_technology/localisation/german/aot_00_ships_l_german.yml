ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR: "Triplex $sr_dark_matter$ Reaktor"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_DESC: "Der größte jemals entwickelte Reaktor dieser Art für ein einzelnes Wesen im Weltraum. Es bietet ausreichend Energie, um alle Systeme der rätselhaften Festung zu betreiben."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_AE: "Triplex $acot_sr_dark_energy$ Reaktor"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_AE_DESC: "Eine enorme Verbesserung gegenüber der vorherigen Generation von $sr_dark_matter$-Reaktoren brachte dieses Biest eines Energiesystems hervor. Drei $acot_sr_dark_energy$-Singularitäten sollten Ihren erhöhten Energiebedarf decken, um Ihre Gegner in Asche zu verwandeln."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_SE: "Triplex-$acot_sr_stellarite$-Reaktor"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_SE_DESC: "Nichts weniger als drei $acot_sr_stellarite$-Singularitäten gewähren Ihnen unvorstellbare Mengen an Energie, um Ihre teuren $acot_sr_stellarite$-Waffen anzutreiben."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_PE: "Triplex-Phi-Reaktor"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_PE_DESC: "Durch die Bergung der $civic_acot_phanon_corps$-Schiffe konnten wir ihre Technologie teilweise zurückentwickeln, was uns die Entwicklung dieses Reaktorprototyps ermöglichte."
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_RE: "Triplex-Runenreaktor"
ENIGMATIC_FORTRESS_DARK_MATTER_REACTOR_RE_DESC: "Nichts Geringeres als der größte jemals entwickelte, der Realität trotzende Runenreaktor. Es wurde speziell für die Verwendung mit der rätselhaften Festung entwickelt und kann nirgendwo anders verwendet werden. Die Leistungsabgabe ist hoch genug, um selbst die leistungshungrigsten Waffen online zu halten."

