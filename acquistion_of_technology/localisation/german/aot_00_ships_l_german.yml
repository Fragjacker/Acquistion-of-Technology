PHANON_MEGATURRET_DARK_MATTER_REACTOR_RE: "$phanon_tier$ Ultrafex-Stromkabel"
PHANON_MEGATURRET_DARK_MATTER_REACTOR_RE_DESC: "Der §R$PHANON_MEGATURRET_DARK_MATTER_REACTOR_RE$§! ist der Endpunkt des systemübergreifenden Stromnetzes, eingebettet in die §R$pgr$§!. Endlose Reihen planetengroßer Reaktoren, die durch unzählige transdimensionale Nullzeit-Powerbanks verbunden sind und in der Lage sind, nahezu augenblicklich realitätsfremde Energiemengen freizusetzen."
PHANON_MEGATURRET_DARK_MATTER_REACTOR_SE: "$sigma_tier$ Gigaflux-Stromleitung"
PHANON_MEGATURRET_DARK_MATTER_REACTOR_SE_DESC: "Der §H$PHANON_MEGATURRET_DARK_MATTER_REACTOR_SE$§! ist der Endpunkt des systemübergreifenden Stromnetzes, eingebettet in die §R$pgr$§!. Endlose Reihen räumlich komprimierter, planetengroßer Reaktoren, die durch unzählige transuniverselle Superflux-Kondensatorbänke verbunden sind und in der Lage sind, realitätsvernichtende Energiemengen in einem Augenblick freizusetzen."

