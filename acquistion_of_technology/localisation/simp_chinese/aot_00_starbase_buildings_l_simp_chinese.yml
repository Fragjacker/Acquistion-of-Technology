l_simp_chinese:

sm_crew_quarters_enigmatic_fortress: "船员休息基地"
sm_crew_quarters_enigmatic_fortress_desc: "为驻扎的船员和后勤人员提供巨大的空间和便利设施。它大大减轻了停泊于此的船队的后勤维护负担。\n"
sm_target_uplink_computer_enigmatic_fortress: "支配者 $sm_target_uplink_computer$ 网络"
sm_target_uplink_computer_enigmatic_fortress_desc: "$sm_target_uplink_computer_desc$\n此升级版本与分散在整个站上的分布式计算设备协同工作，实现更高的空间分辨率。\n"
sm_command_center_enigmatic_fortress: "$deep_space_enigmatic_fortress$ $sm_command_center$"
sm_command_center_enigmatic_fortress_desc: "$sm_command_center_desc$\n专为 $deep_space_enigmatic_fortress$ 设计，该设施比类似系统具有更高的性能。\n"
sm_deep_space_black_site_enigmatic_fortress: "超麦克$sm_deep_space_black_site$"
sm_deep_space_black_site_enigmatic_fortress_desc: "$sm_deep_space_black_site_desc$\n该站的巨大空间允许安装额外的超大校正设施，超越了类似设施的性能。\n"
sm_resource_silo_enigmatic_fortress: "超大规模$sm_resource_silo$"
sm_resource_silo_enigmatic_fortress_desc: "$sm_resource_silo_desc$\n通过使用大规模的 $deep_space_enigmatic_fortress$，存储的资源量可以比类似设施大幅增加。\n"